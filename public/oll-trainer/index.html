<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLL Trainer</title>
  <meta name="description" content="Spaced-repetition (Anki-style) trainer for the 57 OLL cases, with algorithms from SpeedCubeDB.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='6' fill='%2322252c'/%3E%3Cg fill='%23f5c518'%3E%3Crect x='3' y='3' width='7' height='7' rx='1.5'/%3E%3Crect x='11.5' y='3' width='7' height='7' rx='1.5'/%3E%3Crect x='20' y='11.5' width='7' height='7' rx='1.5'/%3E%3Crect x='11.5' y='11.5' width='7' height='7' rx='1.5'/%3E%3Crect x='3' y='20' width='7' height='7' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>OLL Trainer</span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-view="study" role="tab">Study</button>
      <button class="tab" data-view="cases" role="tab">Cases</button>
      <button class="tab" data-view="stats" role="tab">Stats</button>
      <button class="tab" data-view="settings" role="tab">Settings</button>
    </nav>
    <div class="counts" id="counts" title="New · Learning · Due"></div>
  </header>

  <main id="app"></main>

  <dialog id="case-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/cube.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/scramble.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
